server:
  port: 8080

spring:
  application:
    name: titanium-policy
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/policy_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: policy-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
  
  # Liquibase配置
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-init.xml
    default-schema: public

# Axon配置
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      policyProcessor:
        mode: subscribing
  eventstore:
    jpa:
      entity-manager-provider: default
  axonserver:
    enabled: false
  
# 多租户配置
tenant:
  enabled: true
  default-tenant: default-tenant

# 日志配置
logging:
  level:
    com.titanium: debug
    org.axonframework: debug
    org.springframework: info

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
