# 本地开发环境配置
# 使用方式：mvn spring-boot:run -Dspring-boot.run.profiles=local

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/titanium_policy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: YOUR_ACTUAL_PASSWORD  # 请修改为实际的 MySQL root 密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 本地开发可以暂时禁用 Liquibase
  liquibase:
    enabled: false

  # 本地开发允许 JPA 自动创建表（仅用于快速验证）
  jpa:
    hibernate:
      ddl-auto: update  # 仅本地开发使用，生产环境必须是 none
    show-sql: true

# Axon Server 本地配置（简化）
axon:
  axonserver:
    enabled: false  # 本地测试可以禁用 Axon Server

  eventstore:
    jpa:
      entity-manager-provider: default

# Kafka 本地配置（如果没有运行可以禁用）
spring.kafka.enabled: false

logging:
  level:
    com.titanium.policy: debug
    org.axonframework: info
    org.springframework.web: debug
