server:
  port: 8080

spring:
  # 错误文案国际化（m30-07）：资源包位于 titanium-metadata 的 classpath:i18n/messages_*.properties，
  # basename 带 i18n/ 前缀而非裸 messages——裸 messages 会被 JDK ResourceBundle 在多个 jar 之间
  # 只取「第一个」命中者，第三方 jar 若也有根级 messages.properties 会静默顶掉本项目文案。
  messages:
    basename: i18n/messages
    encoding: UTF-8
  application:
    name: titanium-policy
  main:
    allow-bean-definition-overriding: true

  # 事件溯源兼容：容忍事件 payload 中的派生 getter 字段（如 Money.zero / LineCoveragePeriod.wholeLife），
  # 否则历史事件反序列化失败会导致读模型投影永久卡死（详见 AxonSerializerConfig）
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/policy_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA配置
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: policy-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
  
  # Liquibase配置
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml
    default-schema: public

# Axon配置
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      policy-query-group:
        # 源码默认已是TRACKING，可省略；若需显式声明也可保留
        # mode: TRACKING
        dlq:
          enabled: true  # 核心：源码默认false，必须显式开启DLQ
          max-size: 1000 # 补充：源码未直接定义max-size，但这是DLQ核心配置（需手动加）
          cache:
            enabled: true # 补充：DLQ缓存，源码默认false，需手动开启缓存（提升性能）,生产环境按需开启
            size: 2048 # 补充：缓存大小，默认1000（需手动加）
        # 🔴 批量改为1：投影handler含delete+insert操作，batch>1时多事件共享同一事务，
        # 首个handler失败标记tx回滚但后续event的insert已入Hibernate队列，commit时撞主键。
        # 改为1保证每事件独立tx，delete+flush+insert原子化，幂等重放不再重复键冲突。
        batchSize: 1
      # 跨域外发处理组：保单事件推送 Kafka，供监管采集承保数据、再保自动分保等下游消费。
      # 🔴 必须 tracking：Axon 的 DLQ 仅支持流式处理器，subscribing 拿不到重投能力。
      # 首启位点由 titanium.axon.outbound-relay 登记为「事件流末端」，防止全新部署时
      # 把本域全部历史事件重放给下游（tracking 组令牌缺失时默认从头部起算）。
      policy-kafka-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        # 出站按事件独立确认：一条失败只 DLQ 该条序列，不牵连同批。
        batchSize: 1
  eventstore:
    jpa:
      entity-manager-provider: default

  axonserver:
    # 1. 集群连接配置
    clientId: policy-query-node-${HOSTNAME} # 结合主机名，便于识别节点
    servers: axonserver-1:8124,axonserver-2:8124,axonserver-3:8124 # 集群地址
    context: policy-business # 业务上下文隔离
# --------------------------生产环境优化选项-----------------------------

    # 生产环境开启SSL（需配置certFile）
    sslEnabled: true
    certFile: /etc/axon/cert/axonserver.crt
    # 可选：AxonServer认证token（若服务端开启认证）
    token: ${AXON_SERVER_TOKEN} # 从环境变量读取，避免硬编码
    # 2. 流控优化（保单场景默认5000足够，高并发可调整）
    permits: 10000
    # 单独为事件流控配置（可选，若事件量远大于命令/查询）
    eventFlowControl:
      permits: 15000
      nrOfNewPermits: 5000
      newPermitsThreshold: 7500

    # 3. 线程优化（高并发保单场景）
    commandThreads: 20
    queryThreads: 20

    # 4. 分布式事件处理器负载均衡（核心：开启自动均衡）
    eventhandling:
      processors:
        policy-query-group: # 你的事件处理分组
          loadBalancingStrategy: round-robin # 轮询负载均衡
          automaticBalancing: true # 开启自动负载均衡

    # 5. 连接优化（默认合理，显式声明）
    connectTimeout: 5000
    reconnectInterval: 2000
    # 心跳配置（默认合理）
    heartbeat:
      enabled: true
      interval: 10000
      timeout: 7500

      # 6. 其他生产配置
    maxMessageSize: 10485760 # 最大消息大小10MB（应对大事件载荷）
    commitTimeout: 15000 # 提交超时延长至15秒（集群场景）
    eventBlockListingEnabled: true # 保留事件黑名单（防止异常事件拖垮消费）
  tracing:
    repository:
      aggregateIdAttributeName: axon.aggregateId
    # --------------------------生产环境优化选项-----------------------------
    # 2. 分布式事件处理器纳入同一个Trace（便于追踪“Command→事件→Query层消费”全链路）
    eventProcessor:
      distributedInSameTrace: true # 源码默认false，改为true
      distributedInSameTraceTimeLimit: 5m # 超时从2分钟延长到5分钟（适配慢消费场景）
      disableBatchTrace: false # 保留批量消费的追踪（便于排查批量消费异常）
    # 3. 自定义Span属性（仅保留核心元数据，减少追踪数据量）
    attributeProviders:
      aggregateIdentifier: true # 必带：聚合ID（如PolicyId）
      messageId: true # 必带：消息ID
      messageName: true # 必带：消息名（如PolicyIssuedEvent）
      metadata: true # 必带：元数据（如tenantId）
      payloadType: true # 必带：载荷类型
      messageType: false # 可选关闭：消息类型（与messageName重复）
    # 4. 命令/查询总线保持分布式同Trace（默认已开，显式声明）
    commandBus:
      distributedInSameTrace: true
    queryBus:
      distributedInSameTrace: true
    # 5. Saga追踪（若用到Saga则配置，如保单续保流程）
    sagaManager:
      sagaIdentifierAttributeName: axon.policySagaId # 自定义Saga ID属性名，便于识别
# 多租户配置
tenant:
  enabled: true
  default-tenant: default-tenant

# 日志配置
logging:
  level:
    com.titanium: debug
    org.axonframework: debug
    org.springframework: info

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# 跨域出站中继（事件存储即 Outbox）配置
titanium:
  axon:
    outbound-relay:
      # 以 Kafka 外发为职责的处理组：首启位点取「事件流末端」，避免全新部署时重放全量历史事件。
      # 🔴 新增出站发布器（带 @ProcessingGroup 的 Kafka 发布器）必须同步登记于此，否则该组在
      # 首次部署时会从事件流头部起算，把本域全部历史事件重发给下游。
      groups:
        - policy-kafka-group

  # ==========================================================================================
  # 分析型取数声明（G08/g08-06）——由 titanium-analytical-starter 消费，本域零 Java 代码。
  #
  # 🔴 YAML 是开发资产，不是运营配置（方案 R-3）：它声明「哪个字段落在哪张表的哪一列」，
  #    改它走代码评审 + 发版。运营配置的是特征定义（后台），不是取数映射。
  # 实体码 `policy` 与 t_entity_registry 登记行、字段目录的 field_code 前缀三者一致；
  # 请求写 `policy.holder.name`（starter 按首个点切分）⇒ 下方 code 一律**不含**实体码前缀。
  # ==========================================================================================
  analytical:
    # 恒为 none：本域目录表 t_policy_field_catalog 已版本化（含 catalog_version 列），
    # starter 的 init 模式对已版本化目录**主动退让**（代写会造出没有版本头的行）；且本域目录
    # 由 liquibase 灌种子、变更走发布流程，不由 YAML 生成。
    seed-mode: none

    entities:
      policy:
        # CQRS 读模型表：取数走读侧垂直切片，绕过写侧聚合
        table: t_policy_view
        subject-column: policy_id
        # 🔴 如实声明：读模型有投影可见延迟 ⇒ EVENTUAL。与 t_entity_registry.consistency
        #    逐字一致，R-14 一致性对账据此比对。
        consistency: EVENTUAL
        # 读模型无删除标记列（投影不落逻辑删除）——这是**陈述事实**，不是关闭过滤的开关：
        # starter 会用 JDBC 元数据核验本表确无该列，核验不过即拒绝服务。
        deleted-column: none
        # 🔴 不声明 effective-from/to-column：start_date/end_date 是**保障期间**（业务语义），
        #    不是数据时效列。声明后每次取数都要按 [start_date, end_date) 过滤 businessTime，
        #    未生效保单（核保/定价场景的主角）将取不到数——那是静默漏数据；不声明则 asOf
        #    被忽略、响应如实回报 null（契约明确允许）。
        # allow-cross-subject 保持默认 false（最小暴露面）：需跨主体聚合时改这一行即可，
        #    届时是一次显式的评审决策，而不是一个「反正开着」的默认值。
        fields:
          # 字段集 = 目录（t_policy_field_catalog 19 行）∩ 本表实有列，共 10 项。
          # 🔴 四项能力位照搬目录口径（README：与 G07 目录四项同名同义），规则见
          #    dml/policy_field_catalog_analysis_seed_*.sql：analyzable=全部 / aggregatable=
          #    非 TEXT / groupable=集合或 ENUM、DATE / filterable=全部。两份声明取值一致，
          #    避免「目录说可筛选、取数声明说不可筛选」的静默漂移。
          # ⚠️ 目录另 9 个字段（holder.email/address、insured.documentNumber、
          #    payment.accountNumber、loan.outstandingAmount、surrender.reason、
          #    beneficiary.{name,relationship,share}）散在 t_policy_beneficiary / t_policy_loan
          #    等多行表，本表无对应列，当前不可经通用执行器取数——缺口已登记，处置需属主域
          #    建专用分析视图（v_analytical_*）或走 Bean 逃生舱，不属本次接入范围。
          - code: holder.name
            column: policy_holder_name
            type: STRING
            analyzable: true
            filterable: true
          - code: holder.gender
            column: policy_holder_gender
            type: ENUM
            analyzable: true
            aggregatable: true
            groupable: true
            filterable: true
          - code: holder.birthDate
            column: policy_holder_birth_date
            type: DATE
            analyzable: true
            aggregatable: true
            groupable: true
            filterable: true
          - code: holder.documentType
            column: policy_holder_id_type
            type: ENUM
            analyzable: true
            aggregatable: true
            groupable: true
            filterable: true
          - code: holder.documentNumber
            column: policy_holder_id_no
            type: STRING
            analyzable: true
            filterable: true
          - code: holder.mobile
            column: policy_holder_phone
            type: STRING
            analyzable: true
            filterable: true
          - code: insured.name
            column: insured_name
            type: STRING
            analyzable: true
            filterable: true
          - code: status
            column: policy_status
            type: ENUM
            analyzable: true
            aggregatable: true
            groupable: true
            filterable: true
          - code: payment.method
            column: payment_method
            type: ENUM
            analyzable: true
            aggregatable: true
            groupable: true
            filterable: true
          - code: coverage.sumInsured
            column: sum_insured
            type: DECIMAL
            analyzable: true
            aggregatable: true
            groupable: true
            filterable: true
